name: SonarQube

on:
    push:
        branches:
            - master
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    sonar:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: SonarQube scan
              uses: SonarSource/sonarqube-scan-action@v8.1.0
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
