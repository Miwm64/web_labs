name: Qodana

on:
    workflow_dispatch:
    push:
        branches:
            - master
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    qodana:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            checks: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  fetch-depth: 0
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "26"
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Qodana scan
              uses: JetBrains/qodana-action@v2026.1
              with:
                  pr-mode: false
              env:
                  QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_728983222 }}
                  QODANA_ENDPOINT: "https://qodana.cloud"
