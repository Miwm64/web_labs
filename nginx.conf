server {
    listen 8080;
    listen [::]:8080;
    server_name web_lab1;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
